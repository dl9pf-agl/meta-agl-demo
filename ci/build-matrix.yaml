# SPDX-License-Identifier: MIT
# Images owned by meta-agl-demo. Schema and tools: https://github.com/dl9pf-agl/agl-ci (ci/scripts/_matrix.py).
# Machines and tiers (selection of 2026-10-29): qemux86-64 only for now, and no image gates a pull request. `tiers: nightly` =
# nightly, on release and on dispatch; `tiers: dispatch` = manual runs only. Tier presets come from agl-ci (ci/matrix-defaults.yaml).
# `needs` makes a run of a repo it needs also build this repo's images (downstream chain, agl-ci chapter 13).
needs: [meta-agl]
machine_eula: {}

images:
  - {target: agl-ivi-demo-flutter, features: [agl-demo], sdk: false, machines: [qemux86-64], tiers: nightly}
  - {target: agl-ivi-demo-qt, features: [agl-demo], sdk: false, machines: [qemux86-64], tiers: dispatch}
  # The KVM demo is built on an aarch64 host (host qemuarm64, guest virtio-aarch64, the layer's default). The x86-64 variant (host and guest qemux86-64) is
  # shelved: it fails in install_guest_images of agl-kvm-demo.bb, which does not find the guest image under that name.
  - {target: agl-kvm-demo, features: [agl-demo, agl-kvm], sdk: true, machines: [qemuarm64], tiers: nightly}
  - {target: agl-cluster-demo-flutter, features: [agl-demo], sdk: false, machines: [qemux86-64], tiers: dispatch}
  - {target: agl-cluster-demo-qt, features: [agl-demo], sdk: false, machines: [qemux86-64], tiers: dispatch}
  - {target: agl-gateway-demo, features: [agl-demo], sdk: false, machines: [qemux86-64], tiers: dispatch}
  # Board-only images, off while CI builds qemux86-64 only; re-enable with the boards:
  # - {target: agl-instrument-cluster-standalone-demo, features: [agl-ic], sdk: false, machines: [raspberrypi5, sparrow-hawk], tiers: dispatch}
  # - {target: agl-instrument-cluster-standalone-demo-slint, features: [agl-ic, agl-ic-slint], sdk: false, machines: [raspberrypi5, sparrow-hawk], tiers: dispatch}

# yocto-check-layer: the layers of this repo are listed so that `CHECK_LAYERS="meta-agl-demo ..." ci/scripts/validate.sh` of agl-ci and
# CHECK_LAYERS=all can check them. NOT active in CI yet: `default` stays empty until the layers pass; then list them there
# and every run in scope (also a meta-agl run, through `needs`) checks them in addition to meta-agl-core.
check_layers:
  default: []
  dependency_roots:
    - meta-agl-demo
    - external/meta-qt6
    - external/meta-flutter
    - external/meta-virtualization
  layers:
    - meta-agl-demo
    - meta-agl-demo/meta-agl-demo-shared
    - meta-agl-demo/meta-agl-kvm-demo
